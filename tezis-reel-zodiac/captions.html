<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TEZIS Zodiac Captions</title>
<style>
  @font-face { font-family:"Onest"; src:url(fonts/Onest-500.ttf); font-weight:500; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-700.ttf); font-weight:700; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-800.ttf); font-weight:800; }
  :root { --copper:#C49A72; --copper-l:#E2BC94; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; }
  .s { width:1080px; height:1920px; position:relative; overflow:hidden; font-family:"Onest",sans-serif; }
  .grad { position:absolute; left:0; right:0; bottom:0; height:820px; background:linear-gradient(rgba(20,15,12,0), rgba(20,15,12,.26) 50%, rgba(20,15,12,.36)); }
  .tgrad { position:absolute; left:0; right:0; top:0; height:700px; background:linear-gradient(rgba(20,15,12,.34), rgba(20,15,12,.18) 55%, rgba(20,15,12,0)); }
  .cap { position:absolute; left:70px; right:70px; top:1330px; text-align:center; color:#fff;
    font-size:64px; font-weight:800; line-height:1.12; letter-spacing:-.015em; text-transform:uppercase;
    text-shadow:0 0 26px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.4); }
  .w { display:inline-block; margin:0 .11em; transform-origin:50% 80%; position:relative; }
  .w.em { color:var(--copper-l); font-size:1.14em; }
  .w.em i { position:absolute; left:0; bottom:-.06em; height:.075em; background:var(--copper); border-radius:3px; }
  .nb { white-space:nowrap; }
  /* хук в первую секунду */
  .hook { position:absolute; left:80px; right:80px; top:250px; color:#fff; text-shadow:0 0 22px rgba(0,0,0,.3); }
  .hook .bar { height:4px; width:80px; background:var(--copper); margin:0 0 26px; }
  .hook .ln span { display:block; font-size:96px; font-weight:800; line-height:1.0; letter-spacing:-.04em; text-transform:uppercase; }
  .hook .ln span b { color:var(--copper-l); font-weight:800; }
  /* плашка знака зодиака */
  .sign { position:absolute; left:72px; top:262px; display:flex; align-items:center; gap:26px; color:#fff; text-shadow:0 0 20px rgba(0,0,0,.3); }
  .sign .ico { width:120px; height:120px; border-radius:50%; background:var(--copper); display:flex; align-items:center; justify-content:center;
    font-family:"DejaVu Sans",sans-serif; font-size:68px; color:#fff; text-shadow:none; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .sign .txt { overflow:hidden; }
  .sign .nm { font-size:66px; font-weight:800; letter-spacing:-.02em; text-transform:uppercase; line-height:1; }
  .sign .sub { margin-top:10px; font-size:36px; font-weight:500; color:rgba(255,255,255,.92); }
</style>
</head>
<body>
<section class="s" id="s"><div class="grad"></div><div class="tgrad" id="tg"></div><div class="hook" id="hook"></div><div class="sign" id="sign"></div><div class="cap" id="cap"></div></section>
<script src="captions_data.js"></script>
<script>
// сцены по склейкам ролика
const SIGNS = [
  [2.45, 15.3, '♊', 'Близнецы', 'хотят всё и сразу'],
  [15.3, 32.4, '♏', 'Скорпион', 'ищет подвох'],
  [32.4, 42.1, '♓', 'Рыбы', 'витают в мечтах'],
];
const ease = x => 1 - Math.pow(1 - x, 3);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const spring = x => x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(9 * x);

window.render = (t) => {
  // хук: виден с первого кадра
  const hook = document.getElementById('hook'), tg = document.getElementById('tg');
  const h1 = 2.2;
  if (t < h1 + 0.25) {
    const out = clamp((t - h1) / 0.25);
    hook.style.opacity = 1 - out; hook.style.transform = `translateY(${-out * 20}px)`;
    hook.innerHTML = `<div class="bar"></div><div class="ln"><span>Клиенты</span></div><div class="ln"><span>по знаку <b>зодиака</b></span></div>`;
  } else hook.innerHTML = '';

  // плашка знака
  const sign = document.getElementById('sign'); sign.innerHTML = ''; let signVis = 0;
  for (const [a, b, sym, nm, sub] of SIGNS) {
    if (t < a || t >= b) continue;
    const pin = t - a, out = clamp((t - (b - 0.25)) / 0.25);
    const ic = spring(clamp(pin / 0.5)), tx = ease(clamp((pin - 0.15) / 0.4)), sb = ease(clamp((pin - 0.35) / 0.4));
    sign.style.opacity = 1 - out; sign.style.transform = `translateY(${-out * 16}px)`;
    sign.innerHTML = `<div class="ico" style="transform:scale(${0.3 + 0.7 * ic}) rotate(${(1 - ic) * -120}deg);opacity:${clamp(pin / 0.15)}">${sym}</div>
      <div class="txt"><div class="nm" style="transform:translateX(${(1 - tx) * -110}%)">${nm}</div>
      <div class="sub" style="opacity:${sb};transform:translateY(${(1 - sb) * 14}px)">${sub}</div></div>`;
    signVis = 1 - out;
  }
  tg.style.opacity = Math.max(t < h1 + 0.25 ? 1 - clamp((t - h1) / 0.25) : 0, signVis);

  // субтитры: слова появляются в момент произнесения
  const cap = document.getElementById('cap'); cap.innerHTML = '';
  for (let g = 0; g < G.length; g++) {
    const st = G[g][0][0] - 0.06;
    const next = g + 1 < G.length ? G[g + 1][0][0] - 0.06 : 1e9;
    const en = Math.min(next, LAST[g] + 0.35 + HOLD[g]);
    if (t < st || t >= en) continue;
    const out = clamp((t - (en - 0.14)) / 0.14);
    cap.style.opacity = 1 - out; cap.style.transform = `translateY(${-out * 14}px)`;
    const parts = G[g].map(([wt, w0]) => {
      const em = w0.startsWith('*'), w = em ? w0.slice(1) : w0;
      const p = clamp((t - (wt - 0.04)) / (em ? 0.42 : 0.3));
      const sp = spring(p), op = clamp(p * 3);
      const y = (1 - sp) * 34, sc = (em ? 0.5 : 0.72) + (em ? 0.5 : 0.28) * sp;
      const line = em ? `<i style="width:${ease(clamp((t - wt - 0.12) / 0.3)) * 100}%"></i>` : '';
      return `<span class="w${em ? ' em' : ''}" style="opacity:${op};transform:translateY(${y}px) scale(${sc})">${w}${line}</span>`;
    });
    let html = '', run = '';
    G[g].forEach(([, w0], i) => { if (w0.startsWith('*')) run += (run ? ' ' : '') + parts[i]; else { if (run) { html += `<span class="nb">${run}</span>`; run = ''; } html += parts[i]; } });
    if (run) html += `<span class="nb">${run}</span>`;
    cap.innerHTML = html;
  }
};
window.render(0);
</script>
</body>
</html>
