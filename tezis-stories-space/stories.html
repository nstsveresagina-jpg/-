<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TEZIS Stories Space</title>
<style>
  @font-face { font-family:"Onest"; src:url(fonts/Onest-400.ttf); font-weight:400; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-500.ttf); font-weight:500; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-700.ttf); font-weight:700; }
  :root { --copper:#C49A72; --ink:#1E1814; --milk:#F5F1EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#777; }
  /* сторис 1080x1920; верх и низ по 250px не заняты текстом (там интерфейс Instagram) */
  .s { width:1080px; height:1920px; position:relative; overflow:hidden; font-family:"Onest",sans-serif; color:var(--ink); background:var(--milk); margin-bottom:20px; }
  .head { position:absolute; left:64px; right:64px; top:250px; display:flex; align-items:center; gap:28px; }
  .head img { height:38px; display:block; }
  .head i { flex:1; height:1.5px; background:rgba(30,24,20,.3); }
  .head b { font-size:24px; font-weight:500; letter-spacing:.2em; color:rgba(30,24,20,.55); }
  .t { position:absolute; left:64px; right:64px; top:340px; }
  .kick { font-size:24px; font-weight:500; letter-spacing:.32em; text-transform:uppercase; color:rgba(30,24,20,.55); }
  .bar { width:84px; height:3px; background:var(--copper); margin:20px 0 24px; }
  h1 { font-size:76px; font-weight:700; line-height:.98; letter-spacing:-.04em; text-transform:uppercase; }
  h1 span { color:var(--copper); }
  .sub { margin-top:20px; font-size:29px; line-height:1.3; color:rgba(30,24,20,.72); }
  .g { position:absolute; left:64px; right:64px; top:735px; display:grid; grid-template-columns:repeat(3,1fr); column-gap:24px; row-gap:22px; }
  .g figure img { width:100%; aspect-ratio:304/288; object-fit:cover; display:block; border-radius:22px; }
  .g figcaption { margin-top:12px; font-size:26px; font-weight:500; text-align:center; letter-spacing:-.01em; white-space:nowrap; }

  /* обложка */
  .c h1 { font-size:104px; }
  .c .t { top:400px; }
  .c .g { top:1080px; }
  .c .g figcaption { text-transform:uppercase; letter-spacing:.2em; font-size:22px; color:rgba(30,24,20,.6); }
  .c .more { position:absolute; left:64px; right:64px; top:1500px; font-size:30px; color:rgba(30,24,20,.72); }
  .c .more b { color:var(--copper); font-weight:700; }

  /* финал */
  .f { background:var(--ink); color:#fff; }
  .f .head i { background:rgba(255,255,255,.3); }
  .f .head b { color:rgba(255,255,255,.55); }
  .f .kick { color:rgba(255,255,255,.65); }
  .f .t { top:560px; }
  .f h1 { font-size:96px; }
  .f .sub { color:rgba(255,255,255,.78); font-size:34px; margin-top:34px; }
  .f .cta { position:absolute; left:64px; right:64px; top:1240px; border:2px solid var(--copper); border-radius:28px; padding:44px 48px; }
  .f .cta p { font-size:34px; line-height:1.3; color:rgba(255,255,255,.85); }
  .f .cta strong { display:block; font-size:92px; font-weight:700; letter-spacing:-.02em; color:var(--copper); margin:10px 0 6px; }
  .f .addr { position:absolute; left:64px; top:1610px; font-size:26px; color:rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const sets = [
  { img:'color', n:'02', kick:'Цвет', title:'Как цвет <span>меняет</span><br>пространство',
    sub:'Одну и ту же комнату можно сделать ниже, шире или длиннее&nbsp;- только покраской.',
    l:['уменьшить','удлинить','сузить','выделить','занизить','расширить','удлинить','расширить','повысить'] },
  { img:'shades', n:'03', kick:'Оттенки', title:'Как оттенки<br>меняют <span>атмосферу</span>',
    sub:'Тёплые оттенки добавляют уюта, холодные&nbsp;- строгости и прохлады.',
    l:['уютнее','прохладнее','спокойнее','теплее','строже','мягче','глубже','светлее','выразительнее'] },
  { img:'lines', n:'04', kick:'Линии и рисунок', title:'Как линии<br>меняют <span>комнату</span>',
    sub:'Вертикали тянут потолок вверх, горизонтали раздвигают стены.',
    l:['вертикали','горизонтали','широкие полосы','узкие полосы','диагонали','крупный рисунок','мелкий рисунок','рейки','молдинги'] },
  { img:'light', n:'05', kick:'Свет', title:'Как свет <span>меняет</span><br>пространство',
    sub:'Одна люстра делает комнату плоской. Несколько сценариев света&nbsp;- объёмной.',
    l:['подсветка потолка','свет вдоль стен','боковой свет','верхний свет','нижняя подсветка','акцентный свет','рассеянный свет','тёплый свет','холодный свет'] },
  { img:'bigger', n:'06', kick:'Шпаргалка', title:'9 приёмов <span>визуально</span><br>увеличить комнату',
    sub:'Сохраните, чтобы не потерять, когда начнёте ремонт.',
    l:['светлый потолок','акцентная стена','зеркала','вертикальные линии','горизонт. линии','высокие шторы','светлые оттенки','подсветка периметра','единый пол'] },
];
const TOTAL = '07';
const head = (n, logo) => `<div class="head"><img src="src/${logo || 'logo_dark'}.png" alt="TEZIS"><i></i><b>${n} / ${TOTAL}</b></div>`;
let html = `
<section class="s c">${head('01')}
  <div class="t"><div class="kick">Дизайн интерьера</div><div class="bar"></div>
  <h1>Как сделать<br>комнату <span>больше,</span><br>уютнее и выше</h1>
  <div class="sub">Без перепланировки и сноса стен</div></div>
  <div class="g">
    <figure><img src="tiles/color_6.jpg"><figcaption>цвет</figcaption></figure>
    <figure><img src="tiles/lines_1.jpg"><figcaption>линии</figcaption></figure>
    <figure><img src="tiles/light_1.jpg"><figcaption>свет</figcaption></figure>
  </div>
  <div class="more">Листайте дальше <b>→</b> 5 шпаргалок с примерами</div>
</section>`;
for (const s of sets) {
  html += `<section class="s">${head(s.n)}
  <div class="t"><div class="kick">${s.kick}</div><div class="bar"></div><h1>${s.title}</h1><div class="sub">${s.sub}</div></div>
  <div class="g">${s.l.map((t, i) => `<figure><img src="tiles/${s.img}_${i + 1}.jpg"><figcaption>${t}</figcaption></figure>`).join('')}</div>
</section>`;
}
html += `
<section class="s f">${head('07', 'logo_light')}
  <div class="t"><div class="kick">TEZIS / ремонт и дизайн</div><div class="bar"></div>
  <h1>Подберём<br>приёмы <span>под вашу</span><br>квартиру</h1>
  <div class="sub">Цвет, линии и свет закладываем<br>ещё на этапе дизайн-проекта.</div></div>
  <div class="cta"><p>Напишите в директ</p><strong>«РАСЧЁТ»</strong><p>и площадь&nbsp;- пришлём стоимость ремонта</p></div>
  <div class="addr">Тюмень, ул. Газовиков, 40</div>
</section>`;
document.getElementById('root').innerHTML = html;
</script>
</body>
</html>
