<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TEZIS Reels Cover Boitsya</title>
<style>
  @font-face { font-family:"Onest"; src:url(fonts/Onest-500.ttf); font-weight:500; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-700.ttf); font-weight:700; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-800.ttf); font-weight:800; }
  :root { --copper:#C49A72; --ink:#1E1814; --milk:#F5F1EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#777; }
  /* 9:16; в сетке профиля видна центральная зона 3:4 (y 240-1680) - весь текст внутри неё.
     Кадр из ролика целиком, без фильтра и без кропа; плашка с заголовком закрывает вшитый субтитр (y 1138-1306) */
  .s { width:1080px; height:1920px; position:relative; overflow:hidden; font-family:"Onest",sans-serif; color:var(--ink);
       background:url(src/designer.jpg) center/cover; }
  .head { position:absolute; left:64px; right:64px; top:270px; display:flex; align-items:center; gap:26px; }
  .head img { height:34px; display:block; }
  .head i { flex:1; height:1.5px; background:rgba(30,24,20,.3); }
  .head b { font-size:22px; font-weight:500; letter-spacing:.3em; text-transform:uppercase; color:rgba(30,24,20,.7); }
  .plate { position:absolute; left:56px; right:56px; top:1086px; padding:38px 48px 42px; border-radius:30px; background:var(--milk);
           box-shadow:0 18px 50px rgba(0,0,0,.28); }
  .bar { width:80px; height:3px; background:var(--copper); margin-bottom:22px; }
  h1 { font-size:96px; font-weight:800; line-height:.95; letter-spacing:-.045em; text-transform:uppercase; }
  h1 span { color:var(--copper); }
  .sub { margin-top:18px; font-size:30px; font-weight:500; color:rgba(30,24,20,.7); }
</style>
</head>
<body>
<section class="s">
  <div class="head"><img src="logo_dark.png" alt="TEZIS"><i></i><b>Юмор</b></div>
  <div class="plate">
    <div class="bar"></div>
    <h1>Кого боится<br><span>прораб?</span></h1>
    <div class="sub">Спойлер: она уже здесь</div>
  </div>
</section>
</body>
</html>
