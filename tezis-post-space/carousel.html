<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TEZIS Post Space</title>
<style>
  @font-face { font-family:"Onest"; src:url(fonts/Onest-400.ttf); font-weight:400; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-500.ttf); font-weight:500; }
  @font-face { font-family:"Onest"; src:url(fonts/Onest-700.ttf); font-weight:700; }
  :root { --copper:#C49A72; --ink:#1E1814; --milk:#F5F1EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#777; }
  /* слайд карусели 1080x1350 */
  .s { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:"Onest",sans-serif; color:var(--ink); background:var(--milk); margin-bottom:20px; }
  .head { position:absolute; left:64px; right:64px; top:60px; display:flex; align-items:center; gap:28px; }
  .head img { height:36px; display:block; }
  .head i { flex:1; height:1.5px; background:rgba(30,24,20,.3); }
  .head b { font-size:22px; font-weight:500; letter-spacing:.2em; color:rgba(30,24,20,.55); }
  .t { position:absolute; left:64px; right:64px; top:130px; }
  .kick { font-size:22px; font-weight:500; letter-spacing:.32em; text-transform:uppercase; color:rgba(30,24,20,.55); }
  .bar { width:80px; height:3px; background:var(--copper); margin:16px 0 20px; }
  h1 { font-size:64px; font-weight:700; line-height:.98; letter-spacing:-.04em; text-transform:uppercase; }
  h1 span { color:var(--copper); }
  .sub { margin-top:16px; font-size:26px; line-height:1.3; color:rgba(30,24,20,.72); }
  .g { position:absolute; left:64px; right:64px; top:382px; display:grid; grid-template-columns:repeat(3,1fr); column-gap:20px; row-gap:16px; }
  .g canvas { width:100%; display:block; border-radius:20px; }
  .g figcaption { margin-top:8px; font-size:24px; font-weight:500; text-align:center; letter-spacing:-.01em; white-space:nowrap; }

  /* обложка */
  .c .t { top:150px; }
  .c h1 { font-size:92px; }
  .c .hero { position:absolute; left:64px; right:64px; top:660px; }
  .c .hero canvas { width:100%; display:block; border-radius:28px; }
  .c .more { position:absolute; left:64px; right:64px; top:1262px; font-size:26px; color:rgba(30,24,20,.72); display:flex; justify-content:space-between; }
  .c .more b { color:var(--copper); font-weight:700; }

  /* финал */
  .f { background:var(--ink); color:#fff; }
  .f .head i { background:rgba(255,255,255,.3); }
  .f .head b, .f .kick { color:rgba(255,255,255,.6); }
  .f .t { top:240px; }
  .f h1 { font-size:92px; }
  .f .sub { color:rgba(255,255,255,.78); font-size:32px; margin-top:30px; }
  .f .cta { position:absolute; left:64px; right:64px; top:800px; border:2px solid var(--copper); border-radius:28px; padding:40px 48px; }
  .f .cta p { font-size:32px; line-height:1.3; color:rgba(255,255,255,.85); }
  .f .cta strong { display:block; font-size:88px; font-weight:700; letter-spacing:-.02em; color:var(--copper); margin:8px 0 4px; }
  .f .addr { position:absolute; left:64px; top:1220px; font-size:24px; color:rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="root"></div>
<script src="room.js"></script>
<script src="data.js"></script>
<script>
const TOTAL = '07';
const head = (n, logo) => `<div class="head"><img src="src/${logo || 'logo_dark'}.png" alt="TEZIS"><i></i><b>${n} / ${TOTAL}</b></div>`;
let html = `
<section class="s c">${head('01')}
  <div class="t"><div class="kick">Шпаргалка по интерьеру</div><div class="bar"></div>
  <h1>Как сделать<br>комнату <span>больше,</span><br>уютнее и выше</h1>
  <div class="sub">Цвет, линии и свет - без перепланировки и сноса стен</div></div>
  <div class="hero"><canvas data-hero width="1904" height="1160"></canvas></div>
  <div class="more"><span>5 шпаргалок с примерами</span><b>листайте →</b></div>
</section>`;
SETS.forEach((s, si) => {
  html += `<section class="s">${head(s.n)}
  <div class="t"><div class="kick">${s.kick}</div><div class="bar"></div><h1>${s.title}</h1><div class="sub">${s.sub}</div></div>
  <div class="g">${s.items.map((it, i) => `<figure><canvas data-set="${si}" data-i="${i}" width="608" height="500"></canvas><figcaption>${it[0]}</figcaption></figure>`).join('')}</div>
</section>`;
});
html += `
<section class="s f">${head('07', 'logo_light')}
  <div class="t"><div class="kick">TEZIS / ремонт и дизайн</div><div class="bar"></div>
  <h1>Подберём<br>приёмы <span>под вашу</span><br>квартиру</h1>
  <div class="sub">Цвет, линии и свет закладываем<br>ещё на этапе дизайн-проекта.</div></div>
  <div class="cta"><p>Напишите в комментариях</p><strong>«РАСЧЁТ»</strong><p>и площадь&nbsp;- пришлём стоимость ремонта</p></div>
  <div class="addr">Тюмень, ул. Газовиков, 40</div>
</section>`;
document.getElementById('root').innerHTML = html;
document.querySelectorAll('canvas[data-set]').forEach(c => drawRoom(c, SETS[c.dataset.set].items[c.dataset.i][1]));
drawRoom(document.querySelector('canvas[data-hero]'), HERO);
window.READY = true;
</script>
</body>
</html>
